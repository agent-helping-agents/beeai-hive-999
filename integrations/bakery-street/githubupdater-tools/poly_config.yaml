poly_ai:
  # GitHub Configuration
  github:
    token: "${GITHUB_TOKEN}"
    org: "${GITHUB_ORG}"
    user: "${GITHUB_USER}"
  
  # Scoring weights for tool ranking [stars, forks, actions, ai_topics]
  scoring:
    weights: [0.4, 0.3, 0.2, 0.1]
  
  # Workflow templates
  workflows:
    enterprise: "ai_enterprise.yml"
    open_source: "os_workflow.yml"
    ai_ml: "ai_ml_workflow.yml"
    web_app: "web_app_workflow.yml"
    default: "default_workflow.yml"
  
  # AI Integration (Free Alternatives)
  ai:
    enabled: true
    use_local_expert_system: true
    cache_responses: true
    max_tokens: 1000
    temperature: 0.7
  
  # Caching
  cache:
    enabled: true
    ttl: 3600
    max_size: 1000
  
  # Performance
  performance:
    max_workers: 10
    timeout: 30
    retry_attempts: 3
  
  # Security
  security:
    rate_limiting: true
    max_requests_per_minute: 1000
    encryption: true
  
  # Monitoring
  monitoring:
    enabled: true
    metrics_interval: 60
    dashboard_port: 8080
    log_level: "INFO"
