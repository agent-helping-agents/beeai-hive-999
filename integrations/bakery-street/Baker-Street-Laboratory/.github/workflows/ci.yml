name: Baker Street Laboratory CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "requirements.txt" ]; then
          pip install -r requirements.txt
        fi
        pip install pytest pytest-cov pytest-asyncio black flake8 mypy bandit safety
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true
    
    - name: Check code formatting with black
      run: |
        black --check .
      continue-on-error: true
    
    - name: Type check with mypy
      run: |
        mypy . --ignore-missing-imports
      continue-on-error: true
    
    - name: Test with pytest
      env:
        # Mock API keys for testing
        OPENAI_API_KEY: "test-key"
        ANTHROPIC_API_KEY: "test-key"
      run: |
        if [ -d "tests" ]; then
          pytest tests/ -v --cov=. --cov-report=xml || true
        else
          echo "ℹ️  No tests directory found"
        fi
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run security checks with bandit
      run: |
        pip install bandit
        if [ -d "src" ]; then
          bandit -r src/ -f json -o bandit-report.json || true
        else
          bandit -r . -f json -o bandit-report.json || true
        fi
      continue-on-error: true
    
    - name: Upload security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-report
        path: bandit-report.json

  validate-config:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate YAML configuration
      run: |
        python -c "
import yaml
import sys
import os

config_files = ['config/agents.yaml', 'agents.yaml', '.github/workflows/*.yml', '.github/workflows/*.yaml']
found_configs = []

for pattern in config_files:
    import glob
    files = glob.glob(pattern)
    for f in files:
        if os.path.exists(f):
            try:
                with open(f, 'r') as file:
                    config = yaml.safe_load(file)
                print(f'✅ {f} is valid YAML')
                found_configs.append(f)
            except Exception as e:
                print(f'❌ {f} has YAML error: {e}')
                sys.exit(1)

if found_configs:
    print(f'✅ Found and validated {len(found_configs)} configuration files')
else:
    print('ℹ️  No YAML configuration files found')
"
    
    - name: Check environment template
      run: |
        if [ -f ".env.example" ]; then
          echo "✅ Environment template exists"
        else
          echo "ℹ️  .env.example not found (optional)"
        fi
        
    - name: Check project structure
      run: |
        echo "📁 Project structure check:"
        
        # Check for common project files
        files_to_check=("README.md" "requirements.txt" "LICENSE" "LICENSE.md" ".gitignore")
        
        for file in "${files_to_check[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file exists"
          else
            echo "ℹ️  $file not found (optional)"
          fi
        done
        
        # Check for common directories
        dirs_to_check=("src" "tests" "config" "docs" ".github")
        
        for dir in "${dirs_to_check[@]}"; do
          if [ -d "$dir" ]; then
            echo "✅ $dir/ directory exists"
          else
            echo "ℹ️  $dir/ directory not found (optional)"
          fi
        done
