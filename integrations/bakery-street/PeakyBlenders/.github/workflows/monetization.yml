name: Monetization & Premium Features

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened]
  workflow_dispatch:

jobs:
  sponsor-welcome:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'sponsor')
    runs-on: ubuntu-latest
    steps:
    - name: Welcome New Sponsor
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: \🎉 **Welcome to the Peaky Blenders Sponsors!**\n\nThank you for supporting our mission to keep the digital underworld secure! Here's what you get:\n\n## Your Benefits\n- ⭐ Priority feature requests\n- 🔓 Early access to premium features\n- 📞 Direct communication channel\n- 🏆 Recognition in our sponsor hall of fame\n\n## Next Steps\n1. Check your email for sponsor confirmation\n2. Join our [Discord](https://discord.gg/bakerystreet) for exclusive updates\n3. Access premium documentation at: \https://docs.peakyblenders.com/premium\\n\nQuestions? Reply here or email sponsors@bakery-street-project.com\n\n*"By order of the Peaky Blenders - Your support keeps us blending!"*\
          })

  premium-feature-request:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'premium')
    runs-on: ubuntu-latest
    steps:
    - name: Premium Feature Request Template
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: \🔥 **Premium Feature Request Acknowledged!**\n\nThank you for your interest in our premium features. Our development team has been notified.\n\n## Request Details\n- **Priority**: High (Premium subscriber)\n- **Estimated Timeline**: 2-4 weeks\n- **Updates**: We'll provide weekly progress updates\n\n## While You Wait\n- Access our current premium features at: \https://premium.peakyblenders.com\\n- Join our beta testing program for early access\n- Get dedicated support via our premium Discord channel\n\nWould you like us to schedule a call to discuss your specific requirements?\n\n*"Premium features - because the best security deserves the best tools!"*\
          })

  enterprise-inquiry:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'enterprise')
    runs-on: ubuntu-latest
    steps:
    - name: Enterprise Inquiry Response
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: \🏢 **Enterprise Inquiry Received!**\n\nThank you for considering PeakyBlenders Enterprise! Our sales team has been notified and will contact you within 24 hours.\n\n## What Happens Next\n1. **Initial Consultation**: We'll schedule a call to understand your needs\n2. **Custom Proposal**: Receive a tailored enterprise solution\n3. **Pilot Program**: Test our solution in your environment\n4. **Full Deployment**: Seamless integration with SLA guarantees\n\n## Enterprise Benefits\n- ✅ White-label deployment\n- ✅ 99.9% uptime SLA\n- ✅ Dedicated support team\n- ✅ Custom integrations\n- ✅ On-premise options\n- ✅ Compliance assistance (SOC 2, GDPR, HIPAA)\n\nContact: enterprise@bakery-street-project.com | Phone: +1-555-PEAKY\n\n*"Enterprise-grade security for enterprise-scale operations!"*\
          })

  donation-thank-you:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'donation')
    runs-on: ubuntu-latest
    steps:
    - name: Thank You for Donation
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: \🙏 **Thank You for Your Generous Donation!**\n\nYour support means the world to us and helps keep PeakyBlenders free and secure for everyone.\n\n## Your Impact\n- 🔒 Enhanced security infrastructure\n- 🧠 Advanced AI development\n- 📚 Better documentation\n- 🎯 New feature development\n- 🚀 Platform scalability\n\n## Recognition\nYour donation has been recorded in our supporter database. Would you like:\n- Public recognition in our README?\n- Access to our donor-only Discord channel?\n- Early access to new features?\n\n*"Every donation blends into making the digital world safer!"*\
          })