name: Build and Test .NET Projects  
  
on:  
  push:  
    branches: [ main, develop ]  
  pull_request:  
    branches: [ main ]  
  
jobs:  
  build-and-test:  
    runs-on: windows-latest 
    - name: Restore dependencies 
      run: dotnet restore  
  
    - name: Build  
      run: dotnet build --configuration Release --no-restore  
  
    - name: Test  
      run: dotnet test --no-restore --verbosity normal 
