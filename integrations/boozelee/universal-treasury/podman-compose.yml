# Universal Treasury CLI - Podman Compose Configuration
# Run with: podman-compose up -d

version: '3.8'

services:
  treasury-cli:
    image: universal-treasury-cli:1.0.0
    build:
      context: .
      dockerfile: Containerfile
    container_name: treasury-cli
    restart: unless-stopped
    volumes:
      - ~/.treasury:/home/appuser/.treasury
      - ./config:/app/config
    environment:
      - WISE_CLIENT_ID=${WISE_CLIENT_ID}
      - WISE_REDIRECT_URI=${WISE_REDIRECT_URI}
      - WISE_API_KEY=${WISE_API_KEY}
    networks:
      - treasury-net
    healthcheck:
      test: ["CMD", "treasury", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3

