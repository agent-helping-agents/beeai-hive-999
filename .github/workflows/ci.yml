name: BeeAI Hive 999 CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  OLLAMA_HOST: localhost:11434

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install ruff mypy black

      - name: Run Ruff
        run: ruff check .

      - name: Run Black
        run: black --check .

      - name: Run MyPy
        run: mypy .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Ollama (mock)
        run: |
          docker run -d --name ollama-test -p 11434:11434 ollama/ollama:latest || true

      - name: Wait for Ollama
        run: sleep 5

      - name: Run Tests
        run: |
          pytest tests/ -v --tb=short --cov=.
          echo "Coverage: $(pytest-cov --cov=term-missing)"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build
        run: |
          pip install build
          python -m build

      - name: Verify build
        run: |
          pip install dist/*.whl
          python -c "from hive_tui_enhanced import run_tui; print('Build successful')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit
        run: pip install bandit && bandit -r .

      - name: Run Safety
        run: pip install safety && safety check

      - name: Check secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --exclude-files '\.venv|node_modules' > .secrets.json
          if [ -s .secrets.json ]; then
            echo "⚠️ Potential secrets found!"
            cat .secrets.json
          fi

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install sphinx sphinx-rtd-theme
          pip install -e .

      - name: Build docs
        run: |
          cd docs
          make html
          echo "Docs built successfully"

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html/

  ollama-models:
    name: Ollama Models Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Ollama models
        run: |
          pip install ollama
          python scripts/check_ollama_models.py || echo "Ollama not available in CI"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, docs, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Download docs
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: docs/_build/html/

      - name: Deploy to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pip install twine
          twine upload dist/*
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [test, security, docs]
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"BeeAI Hive 999 CI Failed: '${{ job.status }}'"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }} || echo "Slack not configured"
