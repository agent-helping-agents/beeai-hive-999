# Tailscale Configuration for BeeAI Hive 999
# https://login.tailscale.com/admin/settings/keys

# Enable Tailscale integration
enabled: false

# Tailscale authentication key (from Tailscale admin panel)
# Use temporary keys for testing, reusable keys for production
auth_key: "tskey-auth-..."

# Custom hostname for this Hive instance
hostname: "beeai-hive"

# Tailscale tags (for ACL management)
tags:
  - "hive:queen"
  - "hive:research"

# Access Control List (ACL) rules
acl:
  # Allow admin access to all nodes
  allow:
    - src: "autogroup:admin"
      dst: "tag:hive:*:*"
    
    # Allow worker nodes to communicate with each other
    - src: "tag:hive:worker"
      dst: "tag:hive:worker:*"
    
    # Allow queen to communicate with all nodes
    - src: "tag:hive:queen"
      dst: "tag:hive:*:*"
    
    # Allow research nodes to access API endpoints
    - src: "tag:hive:research"
      dst: "tag:hive:api:*"

# Network policy (optional - for Tailscale Policy File ACL)
network_policy:
  groups:
    group:researchers:
      - user1@example.com
      - user2@example.com
  
  hosts:
    tag:hive:queen:
      - "100.100.100.100"
  
  ssh:
    - principals: ["autogroup:admin"]
      src: "autogroup:admin"
      dst: "tag:hive:*"
      accept: ["ssh-rsa"]